<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقارير الحملات | The Best</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--ink:#f6f6f7;--mute:#a1a1aa;--brand:#f15a2d;--brand2:#ff9a3c;--gl1:rgba(255,255,255,.17);--gl2:rgba(255,255,255,.04);--line:rgba(255,255,255,.17);--hi:rgba(255,255,255,.4);--field:rgba(0,0,0,.35);--track:rgba(255,255,255,.12);--sh:0 14px 38px rgba(0,0,0,.32);color-scheme:dark}
[data-theme=light]{--bg:#efeae5;--ink:#1c1c1f;--mute:#6d6d75;--gl1:rgba(255,255,255,.8);--gl2:rgba(255,255,255,.34);--line:rgba(255,255,255,.95);--hi:#fff;--field:rgba(255,255,255,.75);--track:rgba(0,0,0,.1);--sh:0 12px 32px rgba(120,80,50,.16);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Tajawal",-apple-system,"Segoe UI",sans-serif;line-height:1.7;transition:background .4s,color .4s}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6;animation:fl 20s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:300px;height:300px;background:#f15a2d;top:-90px;right:-70px}
.blobs i:nth-child(2){width:260px;height:260px;background:#ff9a3c;bottom:8%;left:-90px;animation-delay:-7s;opacity:.4}
.blobs i:nth-child(3){width:220px;height:220px;background:#b3261e;top:46%;right:-60px;animation-delay:-13s;opacity:.32}
[data-theme=light] .blobs i{opacity:.4}
@keyframes fl{to{transform:translate(-50px,70px) scale(1.18)}}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 118px)}
.screen{animation:in .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.glass,.opt,.back,.nav,.search{position:relative;background:linear-gradient(135deg,var(--gl1),var(--gl2));border:1px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.06),var(--sh)}
.glass::before,.opt::before,.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.24),transparent 55%)}
.logo{display:block;margin:0 auto;height:auto;filter:drop-shadow(0 10px 30px rgba(241,90,45,.3))}
[data-theme=light] .logo{background:#131316;border-radius:28px;padding:14px;box-sizing:content-box}
[data-theme=light] .top img{background:#131316;border-radius:10px;padding:3px}
.hero{text-align:center;padding:14px 0 26px}
.hero h1{font-size:1.8rem;font-weight:800;margin:16px 0 4px;letter-spacing:-.3px;background:linear-gradient(180deg,var(--ink) 40%,var(--mute));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--mute)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.back{width:46px;height:46px;border-radius:16px;color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .2s}
.back:active{transform:scale(.9)}
.back svg{width:20px;height:20px}
.top h2{margin:0;font-size:1.25rem;font-weight:800;flex:1}
.top img{height:38px;width:auto}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:20px;margin-bottom:14px;text-align:right;color:inherit;font:inherit;cursor:pointer;border-radius:24px;overflow:hidden;transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .2s}
.opt:active{transform:scale(.96)}
.opt::after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);pointer-events:none}
.opt:active::after,.opt:hover::after{animation:sw .7s}
@keyframes sw{to{left:140%}}
.opt:hover{border-color:rgba(241,90,45,.6)}
.opt:focus-visible,.back:focus-visible,button:focus-visible,input:focus-visible,.nav a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 8px 22px rgba(241,90,45,.4),inset 0 1px 0 rgba(255,255,255,.4);position:relative;z-index:1}
.ico.mute{background:linear-gradient(135deg,#55555d,#2e2e34);box-shadow:none}
.ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.opt span:not(.ico),.opt b{position:relative;z-index:1}
.opt b{display:block;font-size:1.12rem;font-weight:700}
.opt small{color:var(--mute);font-size:.88rem}
.opt .chev{margin-inline-start:auto;width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2;flex:none;position:relative;z-index:1}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.tag,.bd{font-size:.72rem;padding:2px 10px;border-radius:99px;margin-inline-start:8px;font-weight:500;vertical-align:middle}
.tag{background:rgba(241,90,45,.18);color:var(--brand2)}
.bd.on{background:rgba(52,199,89,.18);color:#37c46a}
.bd.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#37c46a;margin-inline-end:6px;animation:pl 1.6s infinite}
.bd.dn{background:rgba(150,150,160,.2);color:var(--mute)}
@keyframes pl{50%{opacity:.25;transform:scale(1.5)}}
.search{width:100%;height:52px;border-radius:18px;padding:0 18px;color:var(--ink);font:inherit;margin-bottom:16px}
.search::placeholder{color:var(--mute)}
.login{padding:26px 22px;border-radius:32px}
.login label{display:block;font-size:.88rem;color:var(--mute);margin:14px 0 6px}
.login input{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:1rem;padding:0 16px}
.btn{position:relative;overflow:hidden;width:100%;height:56px;margin-top:22px;border:0;border-radius:18px;font:inherit;font-weight:700;font-size:1.05rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 12px 28px rgba(241,90,45,.4),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.btn:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:50%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg)}
.btn:active::after{animation:sw .6s}
.err{color:#ff7a6b;font-size:.9rem;min-height:1.4em;margin:12px 0 0;text-align:center}
.rep-head{text-align:center;padding:6px 0 18px}
.rep-head h1{margin:0;font-size:1.55rem;font-weight:800}
.rep-head p{margin:2px 0 0;color:var(--mute)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ring{padding:18px 10px;text-align:center;border-radius:24px}
.ring svg{width:112px;height:112px;transform:rotate(-90deg);overflow:visible}
.ring .tr{stroke:var(--track)}
.ring .pg{stroke:url(#g);stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(241,90,45,.8));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)}
.ring .pc{margin-top:-80px;height:48px;font-size:1.45rem;font-weight:800;position:relative}
.ring .nm{margin-top:34px;font-weight:700;position:relative}
.ring .sb{color:var(--mute);font-size:.86rem;position:relative}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{padding:16px;text-align:center;border-radius:22px}
.stat b{display:block;font-size:1.6rem;font-weight:800;color:var(--brand2);position:relative}
.stat span{color:var(--mute);font-size:.88rem;position:relative}
details{margin-top:14px;overflow:hidden;border-radius:22px}
summary{list-style:none;cursor:pointer;padding:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:56px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.6rem;color:var(--brand2);line-height:1;transition:transform .25s}
details[open] summary::after{transform:rotate(45deg)}
.rep{padding:16px 18px;border-top:1px solid var(--line);position:relative}
.rep pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:.96rem}
.tl .rep{border:1px solid var(--line);border-radius:20px;margin-bottom:12px}
.note{text-align:center;color:var(--mute);font-size:.8rem;margin-top:22px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.nav{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);display:none;align-items:center;gap:2px;padding:6px;border-radius:28px;z-index:20}
.nav a,.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 16px;min-width:74px;border-radius:22px;color:var(--mute);font:inherit;font-size:.72rem;font-weight:500;text-decoration:none;background:none;border:0;cursor:pointer;transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 6px 18px rgba(241,90,45,.45)}
.nav button{min-width:48px;padding:8px 12px}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s}
#splash img{width:150px;height:auto;animation:pop 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  var h=topbar(n,"#/"+kind)+'<p style="color:var(--mute);margin:-6px 0 16px">اختر نوع التقرير</p>'+
   opt("#/r/"+id+"/sum/"+kind,I.sum,"تقرير شامل","الإجماليات والمتبقي وكل التقارير");
  if(ended)h+=opt("#/r/"+id+"/full/"+kind,I.list,"تقرير مفصل","كل التقارير اليومية بالتفصيل");
  else h+=opt("#/r/"+id+"/day/"+kind,I.day,"تقرير يومي","آخر تقرير تم تسجيله")+opt("#",I.week,"تقرير أسبوعي","","<span class='tag'>قريبًا</span>",1);
  show(h);
 });
}
function ring(v,t,nm){
 var p=t?Math.min(100,Math.round(v/t*100)):0,C=2*Math.PI*44;
 return '<div class="glass ring"><svg viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44" fill="none" stroke-width="8"/><circle class="pg" cx="50" cy="50" r="44" fill="none" stroke-width="8" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-to="'+(C*(1-p/100))+'"/></svg><div class="pc" data-n="'+p+'" data-s="٪">'+fmt(p)+'٪</div><div class="nm">'+nm+'</div><div class="sb">'+fmt(v)+' من '+fmt(t)+'<br>الباقي '+fmt(t-v)+'</div></div>';
}
function blocks(n){return String(n||"").split(/\n\s*ـ{5,}\s*\n/).filter(function(s){return s.trim()})}
function report(id,type,kind){
 loadR(id).then(function(d){
  var back="#/c/"+id+"/"+kind;
  if(!d){show(topbar("تعذر التحميل",back)+'<div class="empty">لم يتم العثور على بيانات هذا التقرير</div>');return}
  var b=blocks(d.notes),h=topbar(d.name,back);
  if(type==="day"){
   h+='<div class="rep-head"><h1>التقرير اليومي</h1><p>آخر تقرير مسجل</p></div><div class="glass rep" style="border-top:0">'+(b.length?'<pre>'+esc(b[b.length-1].trim())+'</pre>':'<div class="empty">لا توجد تقارير</div>')+'</div>';
  }else if(type==="full"){
   h+='<div class="rep-head"><h1>التقرير المفصل</h1><p>'+fmt(b.length)+' تقرير</p></div><div class="tl">'+b.map(function(s){return '<div class="rep"><pre>'+esc(s.trim())+'</pre></div>'}).join("")+'</div>';
  }else{
   h+='<div class="rep-head"><h1>التقرير الشامل</h1><p>'+esc(d.name)+'</p></div><div class="rings">'+ring(d.carved,d.total,"النحت")+ring(d.glued,d.total,"التلصيق")+'</div><div class="stats"><div class="glass stat"><b data-n="'+(d.total||0)+'">'+fmt(d.total)+'</b><span>إجمالي الألواح</span></div><div class="glass stat"><b data-n="'+(d.count||0)+'">'+fmt(d.count)+'</b><span>عدد التقارير</span></div></div>'+
    '<details class="glass"><summary>اضغط لرؤية التقارير اليومية</summary>'+b.map(function(s){return '<div class="rep"><pre>'+esc(s.trim())+'</pre></div>'}).join("")+'</details>';
  }
  show(h);
 });
}
function route(){
 var ok=false;try{ok=sessionStorage.getItem("ok")==="1"}catch(e){}
 var nv=$("nav");nv.style.display=ok?"flex":"none";
 if(!ok)return login();
 var pp=location.hash.replace(/^#\/?/,"").split("/"),k=pp[0]==="c"?pp[2]:pp[0]==="r"?pp[3]:pp[0];if(k!=="active"&&k!=="ended")k="home";
 var as=nv.querySelectorAll("a");for(var j=0;j<as.length;j++)as[j].className=as[j].getAttribute("data-k")===k?"on":"";
 var q=new URLSearchParams(location.search).get("r");
 var p=location.hash.replace(/^#\/?/,"").split("/");
 if(q&&!p[0])return report(q.replace(/[^\w-]/g,""),"sum","active");
 if(!p[0])return home();
 if(p[0]==="active"||p[0]==="ended")return list(p[0]);
 if(p[0]==="c")return types(p[1],p[2]);
 if(p[0]==="r")return report(p[1],p[2],p[3]||"active");
 home();
}

var th="dark";try{th=localStorage.getItem("th")||"dark"}catch(e){}
theme(th);$("tg").onclick=function(){theme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light")};
document.addEventListener("input",function(e){if(e.target.id!=="q")return;var v=e.target.value.trim(),it=document.querySelectorAll(".it");for(var i=0;i<it.length;i++)it[i].style.display=it[i].getAttribute("data-nm").indexOf(v)>-1?"":"none"});
document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".opt,.btn,.back,.nav a,.nav button")&&navigator.vibrate)navigator.vibrate(8)});
var sp=$("splash"),seen=0;try{seen=sessionStorage.getItem("sp")}catch(e){}
if(seen||RM){sp.remove()}else{sp.getElementsByTagName("img")[0].src=LOGO;setTimeout(function(){sp.style.opacity=0;setTimeout(function(){sp.remove()},650)},1300);try{sessionStorage.setItem("sp","1")}catch(e){}}
window.addEventListener("hashchange",route);route();
</script>
